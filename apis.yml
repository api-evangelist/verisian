name: Verisian
description: >-
  Verisian is an AI infrastructure platform for clinical trials, giving
  pharmaceutical sponsors and CROs the information infrastructure required to
  deploy AI across their experts and processes. The platform provides full study
  traceability and automates statistical programming workflows: automating the
  validation of SDTM and ADaM analysis datasets (turning time-consuming QC
  double-programming into value-generating QA oversight), and generating complete
  define-XML files and draft reviewer's guides that are guaranteed consistent with
  the underlying analysis, so teams are submission-ready in hours. Verisian is
  cloud native, compatible with any statistical computing environment (SCE),
  storage, or compute, and integrates through simple file transfer with no complex
  API integration required. It serves statistical programmers, statisticians, data
  managers, medical writers, clinicians, and regulatory teams across in-house and
  CRO-outsourced operating models; Bayer is a named customer. There is no public
  developer API surface — the product is an enterprise application (app.verisian.com)
  accessed after sales onboarding.
